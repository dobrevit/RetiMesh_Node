; ============================================================================
;  RetiMesh Node — standalone Reticulum LoRa gateway for ESP32-S3
;
;  Build environments:
;
;    t3s3            LilyGO T3-S3 v1.2/v1.3 with SX1262. The board uses the
;                    ESP32-S3FH4R2: 4 MB flash + 2 MB in-package QUAD PSRAM,
;                    so memory_type = qio_qspi (matches LilyGO's own
;                    boards/t3_s3_v1_x.json). Verify yours with
;                    `esptool.py flash_id` — an N16R8 module would instead
;                    need qio_opi / 16MB.
;
;    esp32s3-qspi    Generic ESP32-S3 DevKitC-1 (8 MB, quad PSRAM) with an
;                    external SX1262. Override the LoRa pin defines below
;                    to match your wiring.
;
;    tbeam           LilyGO T-Beam v1.1/v1.2 (classic ESP32, PMU, GPS,
;                    18650 holder, no SD card slot).
;
;    t3s3-local      t3s3 built against sibling checkouts of microReticulum
;                    and microStore (library development).
;
;  Filesystem image (data/ -> LittleFS):   pio run -e t3s3 -t uploadfs
;  Firmware:                               pio run -e t3s3 -t upload
;
;  Uploading asks a running node for its bootloader first (the maintenance
;  console on the serial port, or POST /api/system/bootloader at
;  $RETIMESH_NODE_URL) and waits for the application to come back afterwards —
;  see tools/upload_hook.py and docs/local-link.md. esptool's own DTR/RTS reset
;  remains the fallback; RETIMESH_NO_AUTO_BOOTLOADER=1 skips the hand-off.
; ============================================================================

[platformio]
default_envs = t3s3

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; Hashes data/ into the image and into the firmware, so a node can tell when
; the two halves were flashed from different builds. See tools/asset_stamp.py.
extra_scripts =
    pre:tools/asset_stamp.py
    ; Board capabilities from boards.json -> BOARD_* flags; see tools/board_caps.py.
    pre:tools/board_caps.py
    ; Bootloader hand-off around `pio run -t upload`; see tools/upload_hook.py.
    post:tools/upload_hook.py
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Pin the single AsyncTCP event task to core 0, next to the Wi-Fi/LwIP
    ; stack. It only shuttles bytes; all per-packet work (HDLC deframing
    ; output, LoRa fragmentation, CSMA) runs on core-1 tasks — see main.cpp.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    ; microReticulum build settings (see its examples/lora_transport)
    -DMCU_ESP32
    -DMSGPACK_USE_BOOST=OFF
    -DRNS_USE_FS
    -DRNS_LOG_LEVEL=RNS_LOG_LEVEL_DEBUG
    -DUSTORE_USE_LITTLEFS
    -Wno-missing-field-initializers
    ; A display page that is added but never drawn should not compile.
    -Werror=switch
lib_deps =
    jgromes/RadioLib @ ^7.1.2
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.17.0
    ricmoo/QRCode @ ^0.0.1
    ; microReticulum (Apache-2.0) and its dependency set. Its Crypto fork
    ; replaces rweather/Crypto (same classes: SHA256, Ed25519, Curve25519).
    ; microReticulum and microStore come from our forks until the upstream
    ; PRs land: attermann/microReticulum#82 (configurable jobs interval),
    ; #85 (packet-carrying AnnounceHandler callback), attermann/microStore#6
    ; (close the active segment before compaction) and the store sweep fix
    ; without which every reboot empties the path table on a clock-less
    ; device. Both retimesh/combined branches are upstream master + those
    ; branches (+ a <cstdint> include fix in microReticulum).
    microReticulum=https://github.com/dobrevit/microReticulum.git#retimesh/combined
    Crypto=https://github.com/attermann/Crypto.git
    microStore=https://github.com/dobrevit/microStore.git#retimesh/combined
    hideakitai/MsgPack @ ^0.4.2

; ---------------------------------------------------------------------------
; LilyGO T3-S3 v1.2/v1.3 with SX1262 (ESP32-S3FH4R2: 4 MB flash / 2 MB QSPI
; PSRAM). LoRa pin map matches the stock board; defaults live in
; src/Config.h. huge_app.csv = 3 MB app (no OTA) + ~900 KB LittleFS.
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; Flags that only an ESP32-S3 wants. Kept here rather than in [env] so a board
; that is not an S3 needs no knowledge of them — previously each one carried its
; own build_unflags list repeating what to strip, which is three copies of the
; same fact and counting.
;
; PSRAM and the console are NOT family facts, though they were written as if
; they were. In-package PSRAM and the S3's own USB brought out to the connector
; travel together on the T3-S3 and the DevKitC, so they live in one section —
; but the Heltec V3 has neither. It has no PSRAM at all, and a CP2102 in front
; of UART0 rather than native USB, which its own board definition says by
; setting ARDUINO_USB_MODE and pointedly not ARDUINO_USB_CDC_ON_BOOT. Claiming
; both on it cost a failed PSRAM probe on every boot and sent anything written
; to Serial into a peripheral no connector reaches.
; ---------------------------------------------------------------------------
[esp32s3]
build_flags =
    -DARDUINO_USB_MODE=1

[esp32s3_psram_usb]
build_flags =
    ${esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:t3s3]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    ${esp32s3_psram_usb.build_flags}

; ---------------------------------------------------------------------------
; LilyGO T3-S3 carrying the SX1280 (2.4 GHz) module. Same carrier board as
; [env:t3s3]; the radio is selected at build time because it cannot be told
; apart from the sub-GHz parts by probing.
; ---------------------------------------------------------------------------
[env:t3s3-sx1280]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    ${esp32s3_psram_usb.build_flags}
    -DBOARD_T3S3_SX1280

; ---------------------------------------------------------------------------
; Heltec WiFi LoRa 32 V3 — ESP32-S3, SX1262 with a TCXO and DIO2 driving the RF
; switch, 128x64 OLED on the switched Vext rail. 8 MB flash, no SD, no GNSS.
; ---------------------------------------------------------------------------
[env:heltec-v3]
test_ignore = *
board = heltec_wifi_lora_32_V3
; 8 MB part, no SD card — see the table for why that combination matters.
board_build.partitions = partitions/huge_app_8mb.csv
build_flags =
    ${env.build_flags}
    ${esp32s3.build_flags}
    -DBOARD_HELTEC_V3

; ---------------------------------------------------------------------------
; Heltec Wireless Stick V2/V2.1 — ESP32, SX1276, 64x32 OLED on a switched rail,
; no SD and no GNSS. The small panel is what the display layout exists for.
; ---------------------------------------------------------------------------
[env:heltec-ws]
test_ignore = *
board = heltec_wireless_stick
; 8 MB part, no SD card — see the table for why that combination matters.
board_build.partitions = partitions/huge_app_8mb.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HELTEC_WS

; ---------------------------------------------------------------------------
; The amplified SX1280 variant: same board with a PA behind an RF switch.
; ---------------------------------------------------------------------------
[env:t3s3-sx1280-pa]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    ${esp32s3_psram_usb.build_flags}
    -DBOARD_T3S3_SX1280_PA

; ---------------------------------------------------------------------------
; Generic ESP32-S3 DevKitC-1 + external SX1262 module, QSPI PSRAM variant.
; Adjust the pin overrides to your wiring.
; ---------------------------------------------------------------------------
[env:esp32s3-qspi]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    ${esp32s3_psram_usb.build_flags}
    -DPIN_LORA_SCK=5
    -DPIN_LORA_MISO=3
    -DPIN_LORA_MOSI=6
    -DPIN_LORA_CS=7
    -DPIN_LORA_RST=8
    -DPIN_LORA_BUSY=34
    -DPIN_LORA_DIO1=33

; ---------------------------------------------------------------------------
; LilyGO T-Beam v1.1 / v1.2 (classic ESP32, 4 MB flash, no PSRAM, no SD).
; The transceiver and GPS hang off an AXP192/AXP2101 power-management chip,
; which the firmware brings up before probing the radio. Serial is a CH9102
; USB bridge, not native USB, so the CDC-on-boot flags must go.
; ---------------------------------------------------------------------------
[env:tbeam]
test_ignore = *
board = ttgo-t-beam
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_TBEAM
lib_deps =
    ${env.lib_deps}
    lewisxhe/XPowersLib @ ^0.3.3

; ---------------------------------------------------------------------------
; Library development: same as t3s3 but microReticulum/microStore come from
; sibling checkouts (../microReticulum, ../microStore) so changes there can
; be built and flashed without pushing.
; ---------------------------------------------------------------------------
[env:t3s3-local]
extends = env:t3s3
test_ignore = *
lib_deps =
    jgromes/RadioLib @ ^7.1.2
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.17.0
    ricmoo/QRCode @ ^0.0.1
    Crypto=https://github.com/attermann/Crypto.git
    hideakitai/MsgPack @ ^0.4.2
    microReticulum=symlink://../microReticulum
    microStore=symlink://../microStore

; ---------------------------------------------------------------------------
; Host-native unit tests (pure headers only): pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
framework =
test_framework = unity
lib_deps =
build_flags =
    -std=c++17
    -I test/stubs
    -I src
