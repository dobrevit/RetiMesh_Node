; ============================================================================
;  RetiMesh Node — standalone Reticulum LoRa gateway for ESP32-S3
;
;  Build environments:
;
;    t3s3            LilyGO T3-S3 v1.2/v1.3 with SX1262. The board uses the
;                    ESP32-S3FH4R2: 4 MB flash + 2 MB in-package QUAD PSRAM,
;                    so memory_type = qio_qspi (matches LilyGO's own
;                    boards/t3_s3_v1_x.json). Verify yours with
;                    `esptool.py flash_id` — an N16R8 module would instead
;                    need qio_opi / 16MB.
;
;    esp32s3-qspi    Generic ESP32-S3 DevKitC-1 (8 MB, quad PSRAM) with an
;                    external SX1262. Override the LoRa pin defines below
;                    to match your wiring.
;
;    tbeam           LilyGO T-Beam v1.1/v1.2 (classic ESP32, PMU, GPS,
;                    18650 holder, no SD card slot).
;
;    t3s3-local      t3s3 built against sibling checkouts of microReticulum
;                    and microStore (library development).
;
;  Filesystem image (data/ -> LittleFS):   pio run -e t3s3 -t uploadfs
;  Firmware:                               pio run -e t3s3 -t upload
;
;  Uploading firmware asks a running node for its bootloader first (the
;  maintenance console on the serial port, or POST /api/system/bootloader at
;  $RETIMESH_NODE_URL) and waits for the application to come back afterwards —
;  see tools/upload_hook.py and docs/local-link.md. esptool's own DTR/RTS reset
;  remains the fallback; RETIMESH_NO_AUTO_BOOTLOADER=1 skips the hand-off.
;  Only the `upload` target does this; `uploadfs` uses esptool's reset alone.
; ============================================================================

[platformio]
default_envs = t3s3

[env]
; The pioarduino fork of the platform, pinned to a release. PlatformIO's own
; espressif32 stopped at Arduino core 2.0.17 (ESP-IDF 4.4) when Espressif and
; PlatformIO parted ways, and it is frozen there; the only maintained route to
; core 3.x / ESP-IDF 5.x is this fork, which repackages each upstream Arduino
; release. 55.03.311 is Arduino core 3.3.11 on IDF 5.5.5.
; The pin is exact because a platform change is a toolchain change: the
; compiler, the prebuilt IDF libraries and the core's API all move with it, and
; a caret range would let a CI run pick up a different toolchain than the one
; the release was qualified on.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Both modem lines asserted is the "running" state on every board here — a
; USB-UART bridge with DTR/RTS on EN and IO0, and the S3's own USB unit,
; which emulates the same. The monitor used to leave the lines to the kernel
; and reset the node under whoever opened it.
monitor_dtr = 1
monitor_rts = 1
upload_speed = 921600
board_build.filesystem = littlefs
; Hashes data/ into the image and into the firmware, so a node can tell when
; the two halves were flashed from different builds. See tools/asset_stamp.py.
extra_scripts =
    ; Refuses to build a portal page whose JavaScript does not parse. A syntax
    ; error there runs none of the script, so the page loads and does nothing —
    ; and every other check passes, because the file itself is intact. See
    ; tools/check_assets.py.
    pre:tools/check_assets.py
    pre:tools/asset_stamp.py
    ; ...and then compressed on the way into the image, because the A/B
    ; table's 128 KiB filesystem holds the Reticulum store as well and the
    ; portal was taking 70 KiB of it. Must run after the stamp: it copies
    ; what that leaves behind. See tools/pack_assets.py.
    pre:tools/pack_assets.py
    ; Board capabilities from boards.json -> BOARD_* flags; see tools/board_caps.py.
    pre:tools/board_caps.py
    ; What this build is, for a build CI did not version; see tools/fw_version.py.
    pre:tools/fw_version.py
    ; An image has to fit the slot it will be installed into; see
    ; tools/check_image_size.py. PlatformIO's own maximum_size does not enforce.
    post:tools/check_image_size.py
    ; Bootloader hand-off around `pio run -t upload`; see tools/upload_hook.py.
    post:tools/upload_hook.py
build_flags =
    ; src/ is one folder per unit — radio, net, rns, ui, sys, plus the board
    ; headers — and every unit is on the include path, so a header is included
    ; by its own name wherever it is used. The alternative, spelling the unit
    ; into every #include, would have renamed a file in sixty others.
    -I src
    -I src/radio
    -I src/net
    -I src/rns
    -I src/ui
    -I src/sys
    -DCORE_DEBUG_LEVEL=3
    ; Which build this is, in the manifest's terms. An update names the target
    ; it was built for and the node refuses one meant for another, so this has
    ; to be the thing that decides the partition layout, the radio and the
    ; pins — which is the environment, not the marketing name of the board.
    -DOTA_BOARD_ID='"${PIOENV}"'
    ; Pin the single AsyncTCP event task to core 0, next to the Wi-Fi/LwIP
    ; stack. It only shuttles bytes; all per-packet work (HDLC deframing
    ; output, LoRa fragmentation, CSMA) runs on core-1 tasks — see main.cpp.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    ; microReticulum build settings (see its examples/lora_transport)
    -DMCU_ESP32
    -DMSGPACK_USE_BOOST=OFF
    -DRNS_USE_FS
    -DRNS_LOG_LEVEL=RNS_LOG_LEVEL_DEBUG
    -DUSTORE_USE_LITTLEFS
    -Wno-missing-field-initializers
    ; A display page that is added but never drawn should not compile.
    -Werror=switch
lib_deps =
    jgromes/RadioLib @ ^7.7.1
    esp32async/AsyncTCP @ ^3.5.0
    esp32async/ESPAsyncWebServer @ ^3.12.0
    bblanchon/ArduinoJson @ ^7.4.3
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.17.0
    ricmoo/QRCode @ ^0.0.1
    ; microReticulum (Apache-2.0) and its dependency set. Its Crypto fork
    ; replaces rweather/Crypto (same classes: SHA256, Ed25519, Curve25519).
    ; microReticulum and microStore come from our forks until the upstream
    ; PRs land: attermann/microReticulum#82 (configurable jobs interval),
    ; #85 (packet-carrying AnnounceHandler callback), the announce-queue
    ; drain without which an interface forwards no further announce after
    ; the cap first makes it queue one, attermann/microStore#6 (close the
    ; active segment before compaction) and the store sweep fix without
    ; which every reboot empties the path table on a clock-less device.
    ; Both retimesh/combined branches are upstream master + those branches
    ; (+ a <cstdint> include fix in microReticulum).
    microReticulum=https://github.com/dobrevit/microReticulum.git#retimesh/combined
    Crypto=https://github.com/attermann/Crypto.git
    microStore=https://github.com/dobrevit/microStore.git#retimesh/combined
    hideakitai/MsgPack @ ^0.4.2

; ---------------------------------------------------------------------------
; LilyGO T3-S3 v1.2/v1.3 with SX1262 (ESP32-S3FH4R2: 4 MB flash / 2 MB QSPI
; PSRAM). LoRa pin map matches the stock board; defaults live in
; src/Config.h. huge_app.csv = 3 MB app (no OTA) + ~900 KB LittleFS.
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; PSRAM is a build fact that lives here because it is not a board fact the
; registry carries: the in-package die on the T3-S3 and the DevKitC is what
; the memory type in each env already implies. It used to travel with the USB
; console flags in one section, on the theory that both were "S3 things" —
; but the Heltec V3 is an S3 with neither, and the USB flags are now derived
; from boards.json by tools/board_caps.py, where the same fact was already
; written once. Only PSRAM is left to say.
; ---------------------------------------------------------------------------
[esp32s3_psram]
build_flags =
    -DBOARD_HAS_PSRAM

[env:t3s3]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
; The app slot, not the flash. This is what turns an image that outgrew its
; partition into a failed build rather than a node on a pole that cannot
; install its own update: 1920 KiB, matching ota_0/ota_1 in the table.
board_upload.maximum_size = 1966080
; A/B, so this board can be updated with no cable in reach — the enclosure it
; is going into has no way to attach one. partitions/ota_4mb.csv carries the
; arithmetic. Note that this is a one-way door: a partition table can only be
; changed by writing the whole flash over a cable, so it has to be right before
; a node is deployed, not when the first update is wanted.
board_build.partitions = partitions/ota_4mb.csv
build_flags =
    ${env.build_flags}
    ${esp32s3_psram.build_flags}

; ---------------------------------------------------------------------------
; LilyGO T3-S3 carrying the SX1280 (2.4 GHz) module. Same carrier board as
; [env:t3s3]; the radio is selected at build time because it cannot be told
; apart from the sub-GHz parts by probing.
; ---------------------------------------------------------------------------
[env:t3s3-sx1280]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    ${esp32s3_psram.build_flags}
    -DBOARD_T3S3_SX1280

; ---------------------------------------------------------------------------
; Heltec WiFi LoRa 32 V3 — ESP32-S3, SX1262 with a TCXO and DIO2 driving the RF
; switch, 128x64 OLED on the switched Vext rail. 8 MB flash, no SD, no GNSS.
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; Heltec Wireless Paper: the V3's ESP32-S3 and SX1262 with a 2.13" e-ink panel
; in place of the OLED, driven through the display abstraction — the pages
; draw on a canvas and a refresh policy decides what is worth putting on glass
; that takes most of a second to write (src/ui/EinkPanel.h).
; ---------------------------------------------------------------------------
[env:heltec-wp]
test_ignore = *
; PlatformIO's registry has no board file for the Wireless Paper, though the
; Arduino core carries its variant — so the V3's board file supplies the parts
; that are the same (ESP32-S3, 8 MB flash, no PSRAM, qio at 80 MHz) and the
; variant is overridden onto this board's own, the way the Wireless Bridge
; borrows the Wireless Stick's.
board = heltec_wifi_lora_32_V3
board_build.variant = heltec_wireless_paper
board_build.partitions = partitions/huge_app_8mb.csv
; The panel driver. Adafruit_GFX stays in the build, unlike on the headless
; boards: the pages draw on a GFX canvas that EinkPanel owns and blits into the
; driver, because the driver's own display derives from a fork of GFX rather
; than from GFX itself. The SSD1306 is still excluded — there is no OLED here.
lib_deps =
    ${env.lib_deps}
    https://github.com/todd-herbert/heltec-eink-modules.git
lib_ignore =
    Adafruit SSD1306
build_flags =
    ${env.build_flags}
    -DBOARD_HELTEC_WP

; ---------------------------------------------------------------------------
; Heltec V4 (TFT) — ESP32-S3 with 16 MB of flash and 2 MB of on-die PSRAM, an
; SX1262 behind an amplified front end, a 240x320 colour panel with a touch
; layer, two buttons, a sounder, a battery gauge and a GNSS receiver on the
; expansion header.
;
; No board file exists for it in the platform or in PlatformIO's registry, so
; this uses the generic S3 devkit and states the two things that differ: 16 MB
; of flash, and quad PSRAM in package. The pin map is in src/boards/heltec_v4.h
; along with where each number came from.
;
; The panel is an ST7789 over SPI rather than an SSD1306 over I2C, so the OLED
; driver is excluded from this build the way the e-paper board excludes it —
; there is no I2C panel here to talk to.
; ---------------------------------------------------------------------------
[env:heltec-v4]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
; The app slot, not the flash: 4 MB, matching ota_0/ota_1 in the table.
board_upload.maximum_size = 4194304
; A/B from the first flash. A partition table is a one-way door — changing one
; means the whole flash over a cable — and this board is the one with room to
; hold two full slots without squeezing anything, so it walks through the door
; now rather than being deployed behind it. partitions/ota_16mb.csv carries
; the arithmetic.
board_build.partitions = partitions/ota_16mb.csv
; No panel library. The obvious one — Adafruit's ST7789 driver — declares in
; its manifest two libraries its examples use and its driver does not, and one
; of them is the registry's own SD: the AVR library, which does not compile for
; an S3 and which shadows the framework's SD that this firmware means when it
; says #include <SD.h>. Ignoring it takes the framework's with it.
;
; So the panel is driven from src/ui/TftPanel.cpp instead, which is a page of
; ST7789 registers and a blit. That is less code than the workarounds were, it
; is the same shape as the e-paper panel already here — draw on a canvas, put
; the canvas on the glass — and it leaves this board's build with no dependency
; the other boards do not already have.
; And the card library itself: no slot on this board, and nothing here
; includes it — the guards in SdCard.h and OtaUpdate.cpp see to that — but the
; dependency finder does not evaluate #if and would pull it in on the sight of
; the guarded include, then fail to build it for want of a FatFS this board
; has no use for.
lib_ignore =
    Adafruit SSD1306
    SD
; The GUI toolkit, this board only: the mono boards keep their page stack and
; never build it. lv_conf.h lives in src/ui/lvgl and reaches the library via
; LV_CONF_INCLUDE_SIMPLE plus the include path.
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl @ ^9.5.0
build_flags =
    ${env.build_flags}
    ${esp32s3_psram.build_flags}
    -DBOARD_HELTEC_V4
    -DHAS_LVGL_UI=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc/ui/lvgl

[env:heltec-v3]
test_ignore = *
board = heltec_wifi_lora_32_V3
; 8 MB part, no SD card — see the table for why that combination matters.
board_build.partitions = partitions/huge_app_8mb.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HELTEC_V3

; ---------------------------------------------------------------------------
; Heltec Wireless Stick V2/V2.1 — ESP32, SX1276, 64x32 OLED on a switched rail,
; no SD and no GNSS. The small panel is what the display layout exists for.
; ---------------------------------------------------------------------------
[env:heltec-ws]
test_ignore = *
board = heltec_wireless_stick
; 8 MB part, no SD card — see the table for why that combination matters.
board_build.partitions = partitions/huge_app_8mb.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HELTEC_WS

; ---------------------------------------------------------------------------
; Heltec Wireless Bridge: the Wireless Stick's ESP32 and SX1276 in a box,
; without the panel and with 8 MB of PSRAM. PlatformIO has no board file for
; it; the Stick's is the same chip, flash and bridge, and the core's own
; variant for the Bridge is asked for by name so the pin names the core
; itself uses are the right ones.
; ---------------------------------------------------------------------------
[env:heltec-wb]
test_ignore = *
board = heltec_wireless_stick
board_build.variant = heltec_wireless_bridge
board_build.partitions = partitions/huge_app_8mb.csv
; No panel, so the panel's libraries are not part of this build. Saying so is
; necessary as well as tidy: the dependency finder reads #include lines
; without evaluating the #if around them, so the guarded include in
; Display.h would pull the SSD1306 and GFX libraries in and compile them for
; a board that has nothing to draw on. With them excluded, any use of the
; panel outside a HAS_DISPLAY guard fails to compile rather than slipping in.
lib_ignore =
    Adafruit SSD1306
    Adafruit GFX Library
    Adafruit BusIO
build_flags =
    ${env.build_flags}
    -DBOARD_HELTEC_WB
    ; The PSRAM, with the cache workaround a revision-1 ESP32 needs; the same
    ; pair the core's T-Beam variant carries.
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; ---------------------------------------------------------------------------
; The amplified SX1280 variant: same board with a PA behind an RF switch.
; ---------------------------------------------------------------------------
[env:t3s3-sx1280-pa]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    ${esp32s3_psram.build_flags}
    -DBOARD_T3S3_SX1280_PA

; ---------------------------------------------------------------------------
; Generic ESP32-S3 DevKitC-1 + external SX1262 module, QSPI PSRAM variant.
; Adjust the pin overrides to your wiring.
; ---------------------------------------------------------------------------
[env:esp32s3-qspi]
test_ignore = *
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    ${esp32s3_psram.build_flags}
    -DPIN_LORA_SCK=5
    -DPIN_LORA_MISO=3
    -DPIN_LORA_MOSI=6
    -DPIN_LORA_CS=7
    -DPIN_LORA_RST=8
    -DPIN_LORA_BUSY=34
    -DPIN_LORA_DIO1=33

; ---------------------------------------------------------------------------
; LilyGO T-Beam v1.1 / v1.2 (classic ESP32, 4 MB flash, no PSRAM, no SD).
; The transceiver and GPS hang off an AXP192/AXP2101 power-management chip,
; which the firmware brings up before probing the radio. Serial is a CH9102
; USB bridge, not native USB, so the CDC-on-boot flags must go.
; ---------------------------------------------------------------------------
[env:tbeam]
test_ignore = *
board = ttgo-t-beam
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DBOARD_TBEAM
lib_deps =
    ${env.lib_deps}
    lewisxhe/XPowersLib @ ^0.3.3

; ---------------------------------------------------------------------------
; Library development: same as t3s3 but microReticulum/microStore come from
; sibling checkouts (../microReticulum, ../microStore) so changes there can
; be built and flashed without pushing.
; ---------------------------------------------------------------------------
[env:t3s3-local]
extends = env:t3s3
test_ignore = *
lib_deps =
    jgromes/RadioLib @ ^7.7.1
    esp32async/AsyncTCP @ ^3.5.0
    esp32async/ESPAsyncWebServer @ ^3.12.0
    bblanchon/ArduinoJson @ ^7.4.3
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.17.0
    ricmoo/QRCode @ ^0.0.1
    Crypto=https://github.com/attermann/Crypto.git
    hideakitai/MsgPack @ ^0.4.2
    microReticulum=symlink://../microReticulum
    microStore=symlink://../microStore

; ---------------------------------------------------------------------------
; Host-native unit tests (pure headers only): pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
framework =
test_framework = unity
; The same Ed25519 the firmware runs, so the manifest tests can check a
; signature the signing tool actually produced rather than a stand-in. Only the
; two files that touch hardware are platform-specific and both guard themselves,
; so the library builds for the host unchanged.
lib_deps =
    Crypto=https://github.com/attermann/Crypto.git
build_flags =
    -std=c++17
    -I test/stubs
    -I src
    -I src/radio
    -I src/net
    -I src/rns
    -I src/ui
    -I src/sys
