# RNodeInterface block for an RNode that should talk to RetiMesh nodes on
# the default channel. Values must match the node's radio settings page.

[interfaces]
  [[RNode LoRa]]
    type = RNodeInterface
    enabled = yes
    port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXXXXXXXX-if00   # stable name
    mode = full                  # access_point would block this node's own announces

    frequency = 868100000        # Hz
    bandwidth = 125000           # Hz
    txpower = 7                  # dBm
    spreadingfactor = 8
    codingrate = 5

    # Optional station identification: shows up in RetiMesh neighbour lists.
    # Note: RNS sends it id_interval seconds AFTER the interface transmits.
    id_interval = 45
    id_callsign = MYCALL
