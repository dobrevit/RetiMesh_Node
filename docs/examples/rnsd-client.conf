# ~/.reticulum/config — a laptop or rnsd joined to the node's Wi-Fi
# (SSID retimesh-XXXXXX). The node runs Transport; this instance does not
# need to.

[reticulum]
  enable_transport = No
  share_instance = Yes

[interfaces]
  [[RetiMesh Gateway]]
    type = TCPClientInterface
    enabled = yes
    target_host = 10.42.0.1
    target_port = 4242
    # Optional: how this client is treated is decided by the node's
    # "Wi-Fi clients mode" setting (access_point by default).
