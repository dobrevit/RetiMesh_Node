[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retimesh-flash"
version = "0.1.0"
description = "Installer for RetiMesh Node firmware — pick your board, auto-detect the port, flash."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Dobrev IT Ltd" }]
dependencies = [
  "esptool>=4.7,<6",
  "pyserial>=3.5",
]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/dobrevit/RetiMesh_Node"
Flasher = "https://dobrevit.github.io/RetiMesh_Node/"

[project.scripts]
retimesh-flash = "retimesh_flash.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["retimesh_flash*"]
