# Dependabot has no PlatformIO ecosystem; lib_deps in platformio.ini are
# bumped by .github/workflows/pio-deps.yml instead.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; composite actions must be listed too.
    directories:
      - /
      - /.github/actions/build-firmware
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /tools/retimesh-flash
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: deps
