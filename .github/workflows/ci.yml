name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [t3s3, t3s3-sx1280, t3s3-sx1280-pa, esp32s3-qspi, tbeam]
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-firmware
        with:
          env: ${{ matrix.env }}
          version: ${{ steps.ver.outputs.version }}

  tests:
    name: unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip platformio
      - run: pio test -e native

  tools:
    name: tools & CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install ./tools/retimesh-flash
      - run: python -m py_compile tools/*.py
      - run: retimesh-flash --help && retimesh-flash ports
      - name: bump_deps dry run
        run: python tools/bump_deps.py --dry-run
