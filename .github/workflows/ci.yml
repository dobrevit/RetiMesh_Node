name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The board list comes from the registry, not from a copy of it here. Two
  # copies drift, and this pair had: the Heltec Wireless Paper was added to
  # boards.json and platformio.ini and never reached either matrix, so CI
  # never built it and a release would have shipped eight boards while the
  # tree carried nine. hil.yml already derives its matrix this way.
  boards:
    name: which boards to build
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          boards = json.load(open("boards.json"))
          envs = [k for k in boards if not k.startswith("_")]
          if not envs:
              raise SystemExit("boards.json lists no boards")
          print("envs=" + json.dumps(envs))
          PY

  firmware:
    name: firmware (${{ matrix.env }})
    needs: boards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.boards.outputs.envs) }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-firmware
        with:
          env: ${{ matrix.env }}
          version: ${{ steps.ver.outputs.version }}

  # No dependency cache here on purpose: test_typed_store_iterator is a
  # tripwire on a branch-pinned lib_dep, and platformio.ini's [env:native]
  # comment says what caching .pio/libdeps would cost it and what key any
  # cache added here would need.
  tests:
    name: unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip platformio
      - run: pio test -e native

  tools:
    name: tools & CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # rns and msgpack are here for two tests that would otherwise skip, and
      # both are the only thing comparing a hand-copied constant or fixture in
      # this repository with what the reference implementation actually
      # produces: the frame harness's RNS header length, and the golden
      # telemetry hex against the dictionaries the rest of that file asserts
      # against. Skipped, both drift silently, which is the one thing they
      # exist to prevent. tools/tests/optional_deps.py has the rule.
      - run: python -m pip install --upgrade pip && python -m pip install cryptography msgpack rns ./tools/retimesh-flash
      - run: python -m py_compile tools/*.py tools/soak/*.py tools/metrics/*.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The portal pages' JavaScript must parse. A syntax error runs none of
      # the script, so the page loads and does nothing, and no other check in
      # this workflow can see it.
      - run: python3 tools/check_assets.py
      - run: retimesh-flash --help && retimesh-flash ports
      - name: host flashing-tool tests (mocked ports, console and HTTP)
        run: cd tools/retimesh-flash && python -m unittest discover -s tests -t . -v
      # soak.py decides whether a node's previous run is reported as clean or as
      # unknown, and the difference is one default argument. Getting it wrong
      # reads a power cut as a healthy run — the fault that hid a repeating
      # panic for six days.
      # Three things live under tools/tests: soak.py's reading of a node and of
      # a CSV, the LXMF wire formats both collectors share, and the telemetry
      # exporter's rules for what it may publish. The last two are the reason
      # lxmf_wire.py imports no RNS — none of this is installed here, and a
      # format that can only be checked on a bench is a format nothing checks.
      - name: host tooling tests (soak, LXMF wire formats, frame harness, exporter)
        # A dependency-gated test that skips is a green run that checked the
        # one thing it was built to check exactly zero times, so here a missing
        # library is a failure rather than a skip.
        env:
          RETIMESH_REQUIRE_DEPS: "1"
        run: python -m unittest discover -s tools/tests -t . -v
      - name: boards.json local_link blocks are complete
        run: python tools/check_boards.py
      - name: docs/hardware.md board matrix matches boards.json
        run: python tools/board_docs.py --check
      - name: OTA manifest fixture matches the signing tool
        run: python tools/fw_sign.py fixture --check --out test/test_firmware_manifest/fixture.h
      - name: bump_deps dry run
        run: python tools/bump_deps.py --dry-run
