name: HIL (self-hosted bench)

# Hardware-in-the-loop: real USB enumeration, the maintenance console, the
# bootloader transition, esptool, and the application coming back. Runs only on
# a self-hosted runner with the boards attached — never on GitHub's runners,
# which is why it is dispatch-only and why ordinary CI does not depend on it.
#
# Runner setup: label the machine `retimesh-hil`, put each board on a port
# that /dev/serial/by-id or by-path names stably (native USB has a real serial
# number; CP2102s all say 0001, so by-path), and set one repository variable
# per board to that path: HIL_<ENV>_PORT, the env upper-cased with `-` as `_`
# (HIL_T3S3_PORT, HIL_HELTEC_V3_PORT). The plan job turns the dispatch input
# into the matrix from that rule and boards.json, so this file holds no list
# of boards or ports to keep in step with either.

on:
  workflow_dispatch:
    inputs:
      boards:
        description: Space-separated envs to exercise (t3s3 heltec-v3)
        default: t3s3 heltec-v3

permissions:
  contents: read

jobs:
  plan:
    name: which boards, which ports
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          BOARDS: ${{ inputs.boards }}
          VARS: ${{ toJSON(vars) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          boards = json.load(open("boards.json"))
          vars_ = json.loads(os.environ["VARS"])
          rows = []
          for env in os.environ["BOARDS"].split():
              if env.startswith("_") or env not in boards:
                  sys.exit(f"{env}: not an env in boards.json")
              var = "HIL_" + env.upper().replace("-", "_") + "_PORT"
              if not vars_.get(var):
                  sys.exit(f"{env}: repository variable {var} is not set")
              rows.append({"env": env, "port": vars_[var], "chip": boards[env]["chip"]})
          if not rows:
              sys.exit("no boards selected")
          print("matrix=" + json.dumps(rows))
          PY

  hil:
    name: bench (${{ matrix.env }})
    needs: plan
    runs-on: [self-hosted, retimesh-hil]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --upgrade platformio esptool pyserial
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Flash through the PlatformIO hook (console hand-off, esptool, return)
        run: pio run -e ${{ matrix.env }} -t upload --upload-port "${{ matrix.port }}"
      - name: Console, links, bootloader, ROM, flash, return
        run: |
          python3 tools/hil_bootloader.py --port "${{ matrix.port }}" \
            --firmware .pio/build/${{ matrix.env }}/firmware.bin --chip ${{ matrix.chip }}
      - name: Boot, radio, transport (existing checks)
        run: python3 tools/hil.py --port "${{ matrix.port }}" --reset
