name: Release

# Flow: Release Drafter keeps a draft with the next version while PRs merge.
# Pushing the matching tag (vX.Y.Z) builds every board, attaches the
# bundles to that draft, and leaves it for a human to review and publish.
# Publishing then triggers pages.yml, which rebuilds the web flasher.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  # The board list comes from the registry, not from a copy of it here. Two
  # copies drift, and this pair had: the Heltec Wireless Paper was added to
  # boards.json and platformio.ini and never reached either matrix, so CI
  # never built it and a release would have shipped eight boards while the
  # tree carried nine. hil.yml already derives its matrix this way.
  boards:
    name: which boards to build
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          boards = json.load(open("boards.json"))
          envs = [k for k in boards if not k.startswith("_")]
          if not envs:
              raise SystemExit("boards.json lists no boards")
          print("envs=" + json.dumps(envs))
          PY

  build:
    name: firmware (${{ matrix.env }})
    needs: boards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        env: ${{ fromJSON(needs.boards.outputs.envs) }}
    steps:
      - uses: actions/checkout@v7
      - name: the registry describes every board (warns on a test USB PID)
        run: python3 tools/check_boards.py --release
      - uses: ./.github/actions/build-firmware
        with:
          env: ${{ matrix.env }}
          version: ${{ github.ref_name }}

  publish:
    name: attach to draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                 # full history: the commit list needs the previous tag
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
      - name: Normalise artifact layout (firmware-<env>/ -> <env>/)
        run: |
          cd dist
          for d in firmware-*; do mv "$d" "${d#firmware-}"; done
          ls -R
      - name: Build release.json and checksums
        run: python tools/make_manifest.py index --dist dist --version "${{ github.ref_name }}" --repo "${{ github.repository }}"

      - name: Ensure the draft release exists for this tag
        uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          publish: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # gh resolves draft releases by tag and only uploads — it never
      # flips the draft flag. (softprops/action-gh-release published the
      # draft when updating it, which is exactly what this flow must avoid.)
      - name: Attach assets to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(dist/release.json dist/sha256sums.txt dist/*/retimesh-node-*.zip dist/*/retimesh-node-*-merged.bin)
          ls -l "${files[@]}"
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft,assets \
            --jq '"draft=\(.isDraft) assets=\(.assets | length)"'

      # Release Drafter only lists merged pull requests; direct commits to
      # main would leave the notes at "No changes". Append the commits since
      # the previous tag so the draft always describes what shipped.
      - name: Add commit list to the draft notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          range="${prev:+$prev..}$tag"
          {
            echo "## Commits ${prev:+since $prev}"
            echo
            git log --reverse --pretty='- %s (%h)' "$range"
            echo
            gh release view "$tag" --repo "${{ github.repository }}" --json body --jq .body
          } > notes.md
          gh release edit "$tag" --repo "${{ github.repository }}" --notes-file notes.md
