name: Release

# Flow: Release Drafter keeps a draft with the next version while PRs merge.
# Pushing the matching tag (vX.Y.Z) builds every board, attaches the
# bundles to that draft, and leaves it for a human to review and publish.
# Publishing then triggers pages.yml, which rebuilds the web flasher.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    name: firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        env: [t3s3, esp32s3-qspi]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-firmware
        with:
          env: ${{ matrix.env }}
          version: ${{ github.ref_name }}

  publish:
    name: attach to draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
      - name: Normalise artifact layout (firmware-<env>/ -> <env>/)
        run: |
          cd dist
          for d in firmware-*; do mv "$d" "${d#firmware-}"; done
          ls -R
      - name: Build release.json and checksums
        run: python tools/make_manifest.py index --dist dist --version "${{ github.ref_name }}" --repo "${{ github.repository }}"

      - name: Ensure the draft release exists for this tag
        uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          publish: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # gh resolves draft releases by tag and only uploads — it never
      # flips the draft flag. (softprops/action-gh-release published the
      # draft when updating it, which is exactly what this flow must avoid.)
      - name: Attach assets to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(dist/release.json dist/sha256sums.txt dist/*/retimesh-node-*.zip dist/*/retimesh-node-*-merged.bin)
          ls -l "${files[@]}"
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json isDraft,assets \
            --jq '"draft=\(.isDraft) assets=\(.assets | length)"'
